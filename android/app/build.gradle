import java.util.Properties

apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "dev.flutter.flutter-gradle-plugin"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.neu.finote"
    compileSdk 35
    ndkVersion "25.1.8937393" // atau sesuai flutter doctor

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.neu.finote"
       minSdkVersion 23       // 🔥 change from 21 to 23
    targetSdkVersion 34    // or latest supported
    versionCode 1
    versionName "1.0"
    }

    signingConfigs {
    release {
        def storeFilePath = keystoreProperties['storeFile']
        if (storeFilePath) {
            storeFile file(storeFilePath)
        } else {
            println("❌ ERROR: storeFile not found in key.properties")
        }
        storePassword keystoreProperties['storePassword']
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
    }
}

    buildTypes {
        release {
    signingConfig signingConfigs.release
    shrinkResources true
    minifyEnabled true
    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}

    }
}

flutter {
    source '../..'
}
