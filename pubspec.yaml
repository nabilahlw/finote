name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.1
  path_provider: ^2.1.1
  http: ^1.3.0
  get: ^4.6.6
  fl_chart: ^0.64.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.9
  flutter_secure_storage: ^9.2.4
  syncfusion_flutter_charts: ^28.1.38

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/assets/icon.png
